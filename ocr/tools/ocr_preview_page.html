<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OCR 미리보기 · PillyMate AI-1</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #fff; --line: #dde1e6; --text: #1f2328; --muted: #6a737d;
      --accent: #2f6fde; --warn-bg: #fff4d6; --warn-line: #e6b422; --error-bg: #fdecec; --error-line: #d9534f;
      --ok: #1f883d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
    header { padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 16px; padding: 16px 24px; align-items: start; }
    section { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 15px; }
    .types { display: flex; gap: 0; margin-bottom: 12px; }
    .types label { flex: 1; text-align: center; padding: 8px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
    .types label:first-child { border-radius: 6px 0 0 6px; }
    .types label:last-child { border-radius: 0 6px 6px 0; border-left: none; }
    .types input { display: none; }
    .types input:checked + span { font-weight: 600; color: var(--accent); }
    .types label:has(input:checked) { background: #eaf1fd; border-color: var(--accent); }
    .drop { display: grid; place-items: center; min-height: 260px; border: 2px dashed var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; text-align: center; padding: 12px; }
    .drop.dragging { border-color: var(--accent); background: #eaf1fd; }
    .drop img { max-width: 100%; max-height: 420px; object-fit: contain; }
    #file { display: none; }
    button { width: 100%; margin-top: 12px; padding: 10px; border: none; border-radius: 6px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { background: #a9bde3; cursor: default; }
    .status { margin-top: 8px; min-height: 20px; color: var(--muted); font-size: 13px; }
    .banner { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; }
    .banner.error { background: var(--error-bg); border: 1px solid var(--error-line); }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 16px; }
    .summary div { background: var(--bg); border-radius: 6px; padding: 8px 10px; }
    .summary dt { color: var(--muted); font-size: 12px; }
    .summary dd { margin: 2px 0 0; font-weight: 600; word-break: break-all; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .toolbar input { width: 64px; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; background: var(--bg); position: sticky; top: 0; }
    td.name { white-space: normal; min-width: 220px; }
    td.null { color: #b0b7bf; }
    tr.low td { background: var(--warn-bg); }
    tr.low td.confidence { font-weight: 700; color: #9a6700; }
    .badge { display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 12px; background: #eef0f3; }
    .badge.prn { background: #fde7c8; }
    .badge.external { background: #e4dcfb; }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-weight: 600; }
    pre { background: var(--bg); border-radius: 6px; padding: 12px; overflow: auto; max-height: 360px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    .empty { color: var(--muted); }
    @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>OCR 미리보기</h1>
    <p>PillyMate AI-1 개발용 · 사진을 읽을 때마다 CLOVA OCR을 1번 호출해요 · 결과는 API 명세 7절 run_ocr() 형식 그대로예요</p>
  </header>
  <main>
    <section>
      <h2>사진 올리기</h2>
      <div class="types" role="radiogroup" aria-label="문서 종류">
        <label><input type="radio" name="source_type" value="PRESCRIPTION" checked><span>처방전</span></label>
        <label><input type="radio" name="source_type" value="PILL_BAG"><span>약봉투</span></label>
      </div>
      <div class="drop" id="drop" tabindex="0">
        <span id="drop-text">사진을 끌어다 놓거나 눌러서 고르세요<br>jpg · png · 10MB 이하</span>
      </div>
      <input type="file" id="file" accept="image/jpeg,image/png">
      <button id="read" disabled>OCR 읽기</button>
      <div class="status" id="status"></div>
    </section>

    <section>
      <h2>결과</h2>
      <div id="result"><p class="empty">사진을 읽으면 여기에 결과가 나와요.</p></div>
    </section>
  </main>

  <script>
    const MAX_BYTES = 10 * 1024 * 1024;
    const LABELS = {
      name: "약 이름", insurance_code: "보험코드", dose_per_time: "1회량", unit: "단위", daily_count: "1일 횟수",
      total_days: "일수", as_needed: "필요시", max_daily_count: "1일 최대", usage: "용법", route: "경로",
      dosage_form: "제형", confidence: "신뢰도",
    };
    const drop = document.getElementById("drop");
    const fileInput = document.getElementById("file");
    const readButton = document.getElementById("read");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    let selectedFile = null;
    let lastResult = null;
    let threshold = 0.9;

    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(attrs)) {
        if (key === "class") node.className = value; else node.setAttribute(key, value);
      }
      for (const child of children) node.append(child instanceof Node ? child : document.createTextNode(String(child)));
      return node;
    }

    function chooseFile(file) {
      if (!file) return;
      selectedFile = file;
      const image = el("img", { alt: "올린 사진 미리보기" });
      image.src = URL.createObjectURL(file);
      drop.replaceChildren(image);
      readButton.disabled = false;
      statusBox.textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)}MB`;
      if (file.size > MAX_BYTES) statusBox.textContent += " · 10MB를 넘어서 서버가 거절할 거예요";
    }

    drop.addEventListener("click", () => fileInput.click());
    drop.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") fileInput.click(); });
    fileInput.addEventListener("change", () => chooseFile(fileInput.files[0]));
    drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("dragging"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("dragging"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("dragging");
      chooseFile(event.dataTransfer.files[0]);
    });

    readButton.addEventListener("click", async () => {
      if (!selectedFile) return;
      const sourceType = document.querySelector("input[name=source_type]:checked").value;
      readButton.disabled = true;
      statusBox.textContent = "CLOVA OCR로 읽는 중… (최대 25초)";
      try {
        const response = await fetch(`/api/ocr?source_type=${sourceType}`, {
          method: "POST",
          headers: { "Content-Type": selectedFile.type || "application/octet-stream" },
          body: selectedFile,
        });
        const data = await response.json();
        if (!response.ok) {
          renderError(response.status, data);
          statusBox.textContent = `실패 (HTTP ${response.status})`;
        } else {
          lastResult = data;
          renderResult(data);
          statusBox.textContent = `완료 · ${(data.elapsed_ms / 1000).toFixed(1)}초`;
        }
      } catch (error) {
        renderError("연결 실패", { error_type: "NetworkError", message: "미리보기 서버에 연결하지 못했어요. 서버가 켜져 있는지 확인해 주세요." });
        statusBox.textContent = "";
      } finally {
        readButton.disabled = false;
      }
    });

    function renderError(status, data) {
      lastResult = null;
      resultBox.replaceChildren(
        el("div", { class: "banner error" },
          el("strong", {}, `${data.error_type || "오류"} (${status})`), el("br"), data.message || "알 수 없는 오류예요."),
        el("p", { class: "empty" }, "BE-2는 422면 입력 오류, 502면 '처방전을 읽지 못했어요. 다시 찍어 주세요.'로 응답해요."),
      );
    }

    function cell(value, extraClass = "") {
      if (value === null || value === undefined || value === "") return el("td", { class: `null ${extraClass}` }, "—");
      if (value === true) return el("td", { class: extraClass }, el("span", { class: "badge prn" }, "필요시"));
      if (value === false) return el("td", { class: extraClass }, "아니요");
      return el("td", { class: extraClass }, value);
    }

    function renderResult(data) {
      const result = data.result;
      const meds = result.medications || [];
      const summary = el("dl", { class: "summary" },
        ...[
          ["처방일", result.prescription_date], ["병원명", result.hospital_name],
          ["질병분류기호", result.diagnosis_extracted], ["읽은 약", `${meds.length}개`],
        ].map(([label, value]) => el("div", {}, el("dt", {}, label), el("dd", {}, value ?? "—"))),
      );

      const lowCount = meds.filter((m) => m.confidence !== null && m.confidence < threshold).length;
      const thresholdInput = el("input", { type: "number", min: "0", max: "1", step: "0.05", value: String(threshold) });
      thresholdInput.addEventListener("change", () => { threshold = Number(thresholdInput.value); renderResult(lastResult); });
      const toolbar = el("div", { class: "toolbar" },
        "신뢰도", thresholdInput, `미만인 약을 노란색으로 표시 · 현재 ${lowCount}개`);

      const columns = Object.keys(LABELS);
      const head = el("tr", {}, ...columns.map((key) => el("th", {}, LABELS[key])));
      const rows = meds.map((med) => {
        const row = el("tr", { class: med.confidence !== null && med.confidence < threshold ? "low" : "" });
        for (const key of columns) {
          if (key === "route" && med.route) {
            row.append(el("td", {}, el("span", { class: `badge ${med.route === "EXTERNAL" ? "external" : ""}` }, med.route)));
          } else {
            row.append(cell(med[key], key === "name" ? "name" : key));
          }
        }
        return row;
      });
      const table = meds.length
        ? el("div", { class: "table-wrap" }, el("table", {}, el("thead", {}, head), el("tbody", {}, ...rows)))
        : el("p", { class: "empty" }, "약을 하나도 읽지 못했어요 (medications: []). 예외는 아니에요.");

      resultBox.replaceChildren(
        summary, toolbar, table,
        el("details", {}, el("summary", {}, "마스킹한 원문 (raw_text_masked · DB에만 저장)"), el("pre", {}, result.raw_text_masked || "")),
        el("details", {}, el("summary", {}, "run_ocr() 반환값 JSON"), el("pre", {}, JSON.stringify(result, null, 2))),
      );
    }
  </script>
</body>
</html>
